name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v0.3.0 or dependency-injection-v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_id: ${{ steps.release.outputs.package_id }}
    steps:
      - name: Resolve release target
        id: release
        shell: bash
        run: |
          version_pattern='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
          if [[ "$RELEASE_TAG" =~ ^v${version_pattern}$ ]]; then
            project='src/Adsefid.Sdk/Adsefid.Sdk.csproj'
            package_id='Adsefid.Sdk'
            version="${RELEASE_TAG#v}"
          elif [[ "$RELEASE_TAG" =~ ^dependency-injection-v${version_pattern}$ ]]; then
            project='src/Adsefid.Sdk.DependencyInjection/Adsefid.Sdk.DependencyInjection.csproj'
            package_id='Adsefid.Sdk.DependencyInjection'
            version="${RELEASE_TAG#dependency-injection-v}"
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Verify release version
        shell: bash
        env:
          PACKAGE_PROJECT: ${{ steps.release.outputs.project }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          project_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PACKAGE_PROJECT")"
          test "$PACKAGE_VERSION" = "$project_version"

      - run: dotnet restore "${{ steps.release.outputs.project }}"
      - run: dotnet pack "${{ steps.release.outputs.project }}" --configuration Release --no-restore --output artifacts -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/${{ needs.build.outputs.package_id }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
